name: Frontend CI (main)

# Production deploy is handled by Vercel's native GitHub integration.
# This workflow only runs CI checks against main.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-prod.yml"

jobs:
  build:
    name: type-check + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
