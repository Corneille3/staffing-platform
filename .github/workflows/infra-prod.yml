name: Infra CI (main)

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-prod.yml"

jobs:
  validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform format check
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive

      - name: Terraform init (local backend, no credentials needed)
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform validate

  # Apply step — add when AWS credentials are set as repo secrets.
